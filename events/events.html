<!DOCTYPE html>
<head>
    <title>Events for You</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="mb-4">

        <h3 class="fw-bold mb-2">STEM Events</h3>

        <p class="text-muted">
            Explore some STEM events that may interest you.
        </p>

    </div>

    <div class="row g-4">

        <!-- Blog Card 1 -->
        <div class="col-md-3">

            <div class="card h-100 border-0 shadow-sm">

                <img src="#"
                     class="card-img-top"
                     alt="Event image">

                <div class="card-body d-flex flex-column">

                    <span class="badge bg-secondary align-self-start mb-3">
                        Category
                    </span>

                    <h5 class="card-title fw-bold">
                        Blog Post Title One
                    </h5>

                    <p class="text-muted small">
                        By Author Name | 4 min read
                    </p>

                    <p class="card-text">
                        A short description of the blog post,
                        giving readers an idea of its contents.
                    </p>

                    <a href="#" class="btn btn-outline-dark mt-auto">
                        Read More &rarr;
                    </a>

                </div>
            </div>

        </div>


        

    </div>

    </div>
</body>
